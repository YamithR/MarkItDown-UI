name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundle_easyocr:
        description: "Bundle EasyOCR + torch + pre-downloaded models into packages (default: ON, ~1.5GB larger, OCR works offline out of the box)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "markitdown[all]" PyMuPDF Pillow pytesseract
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libfuse2

      # bundle_easyocr is empty on tag pushes -> treat as true so released
      # packages always ship with working offline OCR (user requirement #2/#3)
      # torch/torchvision need the pytorch CPU index; easyocr must come from PyPI
      - name: Install OCR deps + pre-download models
        if: github.event.inputs.bundle_easyocr != 'false'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install easyocr
          python -c "import easyocr; easyocr.Reader(['en','es'], gpu=False, model_storage_directory='assets/easyocr_models', download_enabled=True)"

      - name: Build backend (onedir)
        run: python -m PyInstaller --noconfirm --clean --distpath backend/dist --workpath backend/build backend/backend.spec

      - name: Install Electron deps
        run: npm install --no-audit --no-fund
        working-directory: app

      # extraResources always references assets/easyocr_models -> must exist
      - name: Ensure OCR models dir (may be empty)
        run: mkdir -p assets/easyocr_models

      - name: Build Electron packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux deb AppImage --publish never
        working-directory: app

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            app/release/*.deb
            app/release/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS + portable exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "markitdown[all]" PyMuPDF Pillow pytesseract

      - name: Install OCR deps + pre-download models
        if: github.event.inputs.bundle_easyocr != 'false'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install easyocr
          python -c "import easyocr; easyocr.Reader(['en','es'], gpu=False, model_storage_directory='assets/easyocr_models', download_enabled=True)"

      - name: Build backend (onedir)
        run: python -m PyInstaller --noconfirm --clean --distpath backend/dist --workpath backend/build backend/backend.spec

      - name: Install Electron deps
        run: npm install --no-audit --no-fund
        working-directory: app

      - name: Ensure OCR models dir (may be empty)
        shell: bash
        run: mkdir -p assets/easyocr_models

      - name: Build Electron packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish never
        working-directory: app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            app/release/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-packages/*.deb
            artifacts/linux-packages/*.AppImage
            artifacts/windows-packages/*.exe
          generate_release_notes: true